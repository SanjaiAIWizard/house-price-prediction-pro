    <script>
        let slides = document.querySelectorAll('.background-slideshow img');
        let currentSlide = 0;

        function showNextSlide() {
            slides[currentSlide].classList.remove('active');
            currentSlide = (currentSlide + 1) % slides.length;
            slides[currentSlide].classList.add('active');
        }

        slides[currentSlide].classList.add('active');
        setInterval(showNextSlide, 3000); // Change slide every 3 seconds
  </script>
<!-- end slideshow container -->


   



    <!-- form details -->
     <h3 style="-webkit-text-fill-color:white;text-align: center;">"Your Vision , Our Mission"</h3>
    <div class="container pb-2 my-2 mt-1 text-white border">
      <h3 class="text-left" >Home Price Prediction</h3>
      <form method="post" class="mt-2">
        <div class="mb-1">
          <label for="bedrooms" class="form-label">Bedrooms</label>
          <input
            type="number"
            step="0.1"
            class="form-control"
            name="bedrooms"
            required
          />
        </div>
        <div class="mb-1">
          <label for="bathrooms" class="form-label">Bathrooms</label>
          <input
            type="number"
            step="0.1"
            class="form-control"
            name="bathrooms"
            required
          />
        </div>
        <div class="mb-1">
          <label for="sqft_living" class="form-label">Sqft Living</label>
          <input
            type="number"
            class="form-control"
            name="sqft_living"
            required
          />
        </div>
        <div class="mb-1">
          <label for="floors" class="form-label">Floors</label>
          <input
            type="number"
            step="0.1"
            class="form-control"
            name="floors"
            required
          />
        </div>
        <div class="mb-1">
          <label for="city" class="form-label">City</label>
          <select class="form-control" name="city" required>
            <option value="Seattle">Seattle</option>
            <option value="Bellevue">Bellevue</option>
            <option value="Redmond">Redmond</option>
            <option value="Redmond">Kent</option>
            <option value="Redmond">Lake Forest Park</option>
            <option value="Redmond">Maple Valley</option>
          </select>
        </div>
        <button type="submit" class="btn btn-primary w-100">
          Predict Price
        </button>
      </form>

      {% if prediction %}
      <div class="alert alert-success mt-2 " style="background-color: rgba(60,60,60,0.7);">
        <h4 style="color: white;">Predicted Price:<strong> $.{{ prediction }} </strong></h4>
      </div>
      {% endif %}
    </div>
    <!-- end form details -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
